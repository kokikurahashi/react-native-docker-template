services:
  app:
    build: .
    ports:
      - "8081:8081"
    volumes:
      # ソースをマウントして、保存したらスマホに即反映させる。
      # Windows は WSL 2（Ubuntu）側に置くこと。C:\ に置くと変更が検知されない
      - .:/app
      # node_modules はコンテナ側（Linux 用）を使い、ホストの node_modules で上書きしない
      - node_modules:/app/node_modules
    environment:
      # 実機の Expo Go が接続しに来るアドレス（PC の LAN 内 IP）。make up なら自動で入る
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-127.0.0.1}
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
    # Expo の対話メニュー（r でリロード等）を使えるようにする
    stdin_open: true
    tty: true

volumes:
  node_modules:
